<!DOCTYPE html>
<html>
<head>
    <fieldset>
    <title>Student Detail</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="submit">
        <!-- <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" >
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter email">
        <label for="password">Password:</label>
        <input type="password">
        <label for="Phone">Phone number:</label>
        <input type="Number" name="phone"> -->

        <label>Name:</label>
        <input type="text" placeholder="Enter your name" ><br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter email"><br><br>

        <label>Password:</label>
        <input type="password" placeholder="Enter your password"><br><br>

        <label>Phone number:</label>
        <input type="tel" placeholder="Enter your phone number"><br><br>

        <label>Date of birth:</label>
        <input type="date"><br><br>

        <label>Message/Feedback</label><br><br>
        <textarea placeholder="Enter Message/Feedback" rows="10" cols="50"></textarea><br><br>

     <!-- checkbox  -->
      <!-- Value sends data to server -->
         <label>Hobbies:</label>
         <input type="checkbox" value="cricket"> Cricket 
         <input type="checkbox" value="football"> Football
         <input type="checkbox" value="chess"> Chess
         <input type="checkbox" value="dancing"> Dancing <br><br>
        
     <!-- radio button -->
      <label>Select your gender</label><br><br>
      <input type="radio" value="Male" name="gender">Male
      <input type="radio" value="Female" name="gender">Female
      <input type="radio" value="Others" name="gender">Others<br><br>

      <!-- Buttons -->
       <button>Login</button>
       <button>Register</button><br><br>

       <!-- Dropdown -->
       <label>Select Course</label> <br><br>
       <select name="course"> 
         <option value="0" disabled selected>Select Course</option>
         <option value="bca">BCA</option>
         <option value="csit"> CSIT</option>
         <option value="bit">BIT</option>
         <option value="bba">BBA</option>
         <option value="ca">CA</option>
       </select><br><br><br>
       <button>Register</button>

    </form><br><br>
    </fieldset>
</body>
</html>
