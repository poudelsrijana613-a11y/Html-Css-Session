<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>
    <h1><b>Student Registration Form</b></h1><br><br>
    
    <form>
        <fieldset>
        <label><b>Name:</label></b>
        <input type="text" placeholder="Enter your name">

        <label><b>College:</label></b>
        <input type="text" value="Nepathya College" disabled ><br><br>

        <label><b>Email:</label></b>
        <input type="email" placeholder="Enter your email">

        <label><b>Password:</label></b>
        <input type="password" placeholder="Enter your password"><br><br>

        <label><b>Phone Number:</label></b>
        <input type="Number" placeholder="Enter your phone number">

        <label><b>Date of Birth:</label></b>
        <input type="date"><br><br>
    </fieldset>
    
    <fieldset>
    <label><b>Favourite Programming Langugages</b></label><br>
    <input type="checkbox" value="C">C<br>
    <input type="checkbox" value="C++">C++<br>
    <input type="checkbox" value="javasciript">Javasciript<br><br>
    </fieldset>

    <fieldset>
    <label><b>Gender</b></label><br>
    <input type="radio" name="gender" value="man">Man
    <input type="radio" name="gender" value="woman">Woman<BR><BR>
        </fieldset>

        <fieldset>
    <label><b>Select Course</b></label>
    <select name="course">
        <option value="0" disabled selected>Select Course</option> 
        <option value="bca">BCA</option> 
        <option value="csit">CSIT</option> 
        <option value="bba">BBA</option> 
        <option value="ca">CA</option> 
    </select><br><br>
    </fieldset>

    <fieldset>
    <label><b>Upload your document</b></label>
    <input type="file"><br><br>

    <label><b>Message/Feedback/Bio/Caption</b></label><br>
    <textarea placeholder="Enter message/feedback/bio/caption" rows="10" cols="50"></textarea><br><br>
<button>Register</button>  
<button>Login</button>  

</form>
</fieldset>    
</body>
</html>
