<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="rev.css">
</head>

<div class="form">
    
    <body>
         <fieldset>
        <form>
            <h1 style="text-align: center">Student Registration Form</h1>
            <label >Full Name:</label>
            <input type="text" placeholder="Enter your name"><br><br>

            <label>Email:</label>
            <input type="email" placeholder="Enter your email"><br><br>

            <label>Password:</label>
            <input type="password" placeholder="Enter your password"><br><br>

            <label>Age:</label>
            <input type="number" placeholder="Enter age"><br><br>

            <label>Date of birth:</label>
            <input type="date"><br><br>

            <label>Gender:</label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female<br><br>

            <label>Hobbies:</label>
            <input type="checkbox" name="hobbies">Reading
            <input type="checkbox" name="hobbies">Sports<br><br>

            <h2>Student Information Table</h1>
            <table border="1" style="width: 100%; text-align: center;">
               <tr>
                <th rowspan="2">Student</th>
                <th colspan="3">Academic Details</th>
               </tr>

               <tr>
                <th>Course</th>
                <th>Semester</th>
                <th>Grade</th>
               </tr>          
               
               <tr>
                <td>Alpha</td>
                <td>CSIT</td>
                <td>1<sup>st</sup></td>
                <td>A</td>
               </tr>    
               
               <tr>
                <td>Beta</td>
                <td>BCA</td>
                <td>2<sup>nd</sup></td>
                <td>B+</td>
               </tr>
            </table><br>
        <button id="sub">Submit</button>
        <button id="res">Reset</button>   
        </form>
    </body>
</fieldset>
</div>

</html>
